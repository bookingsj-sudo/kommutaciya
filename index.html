<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Калькулятор коммутации</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0C0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Коммутация">
<style>
/* Вход по паролю: один столбец по центру. Цвета и скругления — как в калькуляторе (оформление 06.11.2026). */
:root { --bg: #0C0C0E; --card: #151518; --field: #1C1C20; --line: #2A2A31; --fg: #F3F3F5; --fg2: #A6A6B0; --fg3: #8A8A96; --acc: #5BB1F2; --pri: #F3F3F5; --on-pri: #121216; --err: #FF8179; color-scheme: dark;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; }
@media (prefers-color-scheme: light) { :root { --bg: #F6F6F7; --card: #FFFFFF; --field: #F3F3F5; --line: #E4E4E8; --fg: #0E0E12; --fg2: #55555F; --fg3: #6B6B77; --acc: #06639F; --pri: #17171B; --on-pri: #FFFFFF; --err: #B42318; color-scheme: light; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); letter-spacing: -.006em; -webkit-font-smoothing: antialiased; display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
main { width: 100%; max-width: 380px; display: grid; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 21px; font-weight: 600; }
p { margin: 0; color: var(--fg2); }
label { display: grid; gap: 6px; font-size: 13px; color: var(--fg2); }
input[type=password], input[type=text] { font: 17px var(--font); color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--fg2); }
.chk input { width: 18px; height: 18px; }
button { font: 600 16px var(--font); color: var(--on-pri); background: var(--pri); border: 0; border-radius: 10px; padding: 13px; cursor: pointer; }
button[disabled] { opacity: .6; }
.err { color: var(--err); font-size: 14px; min-height: 1.2em; }
.dim { color: var(--fg3); font-size: 13px; }
.mark { display: flex; gap: 3px; align-items: flex-end; height: 28px; }
.mark i { display: block; width: 26px; border-radius: 3px; background: var(--acc); }
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <div class="mark" aria-hidden="true"><i style="height:10px"></i><i style="height:16px"></i><i style="height:22px"></i><i style="height:28px"></i></div>
    <h1>Калькулятор коммутации</h1>
    <p id="intro">Введите пароль калькулятора. Без пароля страница не откроется: всё содержимое зашифровано.</p>
    <form id="f" autocomplete="on">
      <div style="display:grid;gap:14px">
        <input type="text" name="username" value="kalkulyator" autocomplete="username" hidden>
        <label for="pw">Пароль<input type="password" id="pw" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
        <label class="chk"><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
        <button type="submit" id="go">Открыть</button>
        <div class="err" id="err" role="alert"></div>
      </div>
    </form>
  </div>
  <p class="dim">Пароль — у руководителя. Сайт работает в Safari, Chrome, Firefox и других браузерах; можно добавить на экран «Домой».</p>
</main>

var subtle = window.crypto && window.crypto.subtle;
if (!subtle) {
  $('intro').textContent = 'Этот браузер не умеет расшифровывать страницу. Откройте ссылку в Safari, Chrome или Firefox (адрес должен начинаться с https://).';
  $('f').hidden = true; return;
}
function derive(pw) {
  return subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
    return subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(B.salt), iterations: B.iter }, base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  });
}
function openWith(key, remember) {
  return subtle.decrypt({ name: 'AES-GCM', iv: u8(B.iv) }, key, u8(B.ct)).then(function (pt) {
    return subtle.exportKey('raw', key).then(function (raw) {
      var r = b64u(new Uint8Array(raw));
      store.set('sessionStorage', 'la-site-key', r); // калькулятор берёт ключ отсюда: шифровать и читать ссылки с расчётами
      if (remember) store.set('localStorage', 'la-site-key', r);
      window.__LA_SITE = { key: key };
      var html = new TextDecoder().decode(pt);
      // подменить страницу целиком — только когда страница входа полностью загружена: если подменять во время загрузки,
      // браузер не очищает страницу, а дописывает калькулятор под окно входа (так было при запомненном пароле)
      var go = function () {
        document.open(); document.write(html); document.close();
        // страховка: если браузер всё же оставил окно входа на странице — один раз перезагрузить (ключ уже в sessionStorage)
        setTimeout(function () {
          if (document.getElementById('card') && !store.get('sessionStorage', 'la-reload-once')) { store.set('sessionStorage', 'la-reload-once', '1'); location.reload(); }
          else store.del('sessionStorage', 'la-reload-once');
        }, 600);
      };
      if (document.readyState === 'complete') setTimeout(go, 0); else window.addEventListener('load', function () { setTimeout(go, 0); }, { once: true });
    });
  });
}
var saved = store.get('localStorage', 'la-site-key') || store.get('sessionStorage', 'la-site-key');
if (saved) {
  $('go').disabled = true; $('go').textContent = 'Открываю…';
  subtle.importKey('raw', fromB64u(saved), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt'])
    .then(function (k) { return openWith(k, false); })
    .catch(function () { store.del('localStorage', 'la-site-key'); store.del('sessionStorage', 'la-site-key'); $('go').disabled = false; $('go').textContent = 'Открыть'; $('err').textContent = 'Пароль сменился — введите новый.'; });
}
$('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var pw = $('pw').value; if (!pw) return;
  $('go').disabled = true; $('go').textContent = 'Проверяю…'; $('err').textContent = '';
  derive(pw).then(function (k) { return openWith(k, $('rem').checked); }).catch(function () {
    $('go').disabled = false; $('go').textContent = 'Открыть'; $('err').textContent = 'Неверный пароль.'; $('pw').select();
  });
});
})();
</script>
